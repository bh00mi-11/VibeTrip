<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Itinerary - VibeTrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-subtle: #e2e8f0;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; }
        .navbar { background: #ffffff; border-bottom: 1px solid var(--border-subtle); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.25rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #fff; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.88rem; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .timeline-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.75rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-md); }
        .timeline-slot { border-left: 2px solid var(--primary-light); padding-left: 1.25rem; margin-bottom: 1.25rem; position: relative; }
        .timeline-slot::before { content: ''; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: capitalize; background: var(--primary-light); color: var(--primary); }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="brand" onclick="window.location.href='/'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            VibeTrip
        </div>
        <a href="/" class="btn-primary">Plan Your Own Trip</a>
    </header>

    <main id="share-container" style="max-width:840px; margin:2.5rem auto; padding:0 1.5rem;">
        <div style="text-align:center; padding:4rem; color:var(--text-secondary);">Loading shared itinerary...</div>
    </main>

    <script>
        const API_BASE = window.location.origin.includes('5173') ? 'http://localhost:8005' : window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        async function loadSharedTrip() {
            const container = document.getElementById("share-container");
            if (!token) {
                container.innerHTML = "<div style='color:#ef4444; text-align:center; padding:3rem;'>Missing share token in link.</div>";
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/trips/shared/${encodeURIComponent(token)}`);
                if (!res.ok) throw new Error("Trip not found or expired.");
                const data = await res.json();
                const itin = data.itinerary;

                let html = `
                    <div style="margin-bottom:2.25rem; text-align:center;">
                        <span class="badge" style="background:#e0f2fe; color:#0284c7; padding:4px 12px; font-size:0.8rem;">Shared Itinerary</span>
                        <h1 style="font-size:2.4rem; font-weight:800; margin:0.8rem 0 0.3rem; color:#0f172a;">${data.destination} Itinerary</h1>
                        <p style="color:#64748b; font-size:0.95rem;">Curated by <strong>${data.created_by}</strong> • ${data.created_at ? data.created_at.substring(0, 10) : 'Recent'}</p>
                        ${itin.crowd_tip ? `<p style="color:#475569; font-size:0.88rem; margin-top:0.75rem; max-width:620px; margin-left:auto; margin-right:auto; background:#f1f5f9; padding:0.6rem 1rem; border-radius:8px;">💡 ${itin.crowd_tip}</p>` : ''}
                    </div>
                `;

                for (const day of (itin.days_itinerary || [])) {
                    html += `
                        <div class="timeline-card">
                            <h3 style="font-size:1.2rem; font-weight:700; color:var(--primary); margin-bottom:1.25rem;">${day.theme}</h3>
                            ${(day.slots || []).map(s => `
                                <div class="timeline-slot">
                                    <div style="font-size:0.75rem; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:2px;">
                                        ${s.time_slot} ${s.est_distance ? `&bull; ${s.est_distance}` : ''}
                                    </div>
                                    <div style="font-size:1.05rem; font-weight:700; margin:0.25rem 0; color:#0f172a;">
                                        ${s.place_name} <span class="badge">${s.category || 'Spot'}</span>
                                    </div>
                                    <div style="font-size:0.88rem; color:#475569; line-height:1.4;">${s.tip || ''}</div>
                                </div>
                            `).join("")}
                        </div>
                    `;
                }

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div style="color:#ef4444; text-align:center; padding:3rem; font-weight:600;">${err.message}</div>`;
            }
        }
        loadSharedTrip();
    </script>
</body>
</html>
